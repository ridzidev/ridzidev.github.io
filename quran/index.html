<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Quran App</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <button class="btn btn-outline-dark" id="dark-mode-toggle">Dark Mode</button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading the Quran Data...</p>
    </div>

    <div class="container">
        <form id="quran-form">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="surah">Select Surah:</label>
                    <select class="form-control" id="surah">
                        <option value="">Select Surah</option>
                    </select>
                </div>
                <div class="form-group col-md-6">
                    <label for="juz">Select Juz:</label>
                    <select class="form-control" id="juz">
                        <option value="">Select Juz</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="search">Search Ayah:</label>
                <input type="text" class="form-control" id="search" placeholder="Enter ayah text">
            </div>
        </form>

        <div class="content" id="content"></div>
    </div>

    <div class="footer">
        <p class="text-center mb-0">&copy; 2023-<?php echo date("Y"); ?> Quran App by Primaginary Learning Platform</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize Juz selector
            const juzSelect = document.getElementById('juz');
            for (let j = 1; j <= 30; j++) {
                juzSelect.innerHTML += `<option value="${j}">Juz ${j}</option>`;
            }

            // Load Surah list
            fetch('https://equran.id/api/v2/surat')
                .then(response => response.json())
                .then(data => {
                    const surahSelect = document.getElementById('surah');
                    data.data.forEach(surah => {
                        surahSelect.innerHTML += `
                            <option value="${surah.nomor}">
                                ${surah.nomor}. ${surah.namaLatin} (${surah.nama})
                            </option>`;
                    });
                });

            // Event listeners
            document.getElementById('surah').addEventListener('change', function() {
                document.getElementById('juz').value = '';
                handleSelectChange();
            });
            
            document.getElementById('juz').addEventListener('change', function() {
                document.getElementById('surah').value = '';
                handleSelectChange();
            });

            document.getElementById('search').addEventListener('input', handleSearch);
            document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);
        });

        async function fetchData() {
            const surah = document.getElementById('surah').value;
            const juz = document.getElementById('juz').value;
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';
            document.querySelector('.loading').style.display = 'flex';

            try {
                if (surah) {
                    const response = await fetch(`https://equran.id/api/v2/surat/${surah}`);
                    const data = await response.json();
                    displaySurah(data.data);
                } else if (juz) {
                    const [arabicRes, translationRes] = await Promise.all([
                        fetch(`https://api.alquran.cloud/v1/juz/${juz}/quran-simple`),
                        fetch(`https://api.alquran.cloud/v1/juz/${juz}/id.indonesian`)
                    ]);
                    const arabicData = await arabicRes.json();
                    const translationData = await translationRes.json();
                    displayJuz(arabicData.data, translationData.data);
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                contentDiv.innerHTML = '<p class="text-danger">Error loading data. Please try again.</p>';
            } finally {
                document.querySelector('.loading').style.display = 'none';
            }
        }

        function displaySurah(surah) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <h2 class="text-center mb-4">${surah.namaLatin} (${surah.nama})</h2>
                <p class="text-muted mb-4">${surah.deskripsi}</p>`;
        
            surah.ayat.forEach(ayah => {
                // Format Surah and Ayah numbers to match EveryAyah.com format
                const surahNumber = ayah.surah.nomor.toString().padStart(3, '0'); // e.g., 001 for Al-Fatiha
                const ayahNumber = ayah.nomorAyat.toString().padStart(3, '0'); // e.g., 001 for first Ayah
        
                const audioUrl = `https://everyayah.com/data/Abdul_Basit_Murattal_64kbps/${surahNumber}${ayahNumber}.mp3`;
        
                contentDiv.innerHTML += `
                    <div class="ayah">
                        <div class="ayah-number text-primary mb-2">Ayat ${ayah.nomorAyat}</div>
                        <div class="arabic-text mb-3">${ayah.teksArab}</div>
                        <div class="indonesian-text mb-3">${ayah.teksIndonesia}</div>
                        <audio controls class="mb-4">
                            <source src="${audioUrl}" type="audio/mpeg">
                            Browser tidak mendukung audio.
                        </audio>
                    </div>`;
            });
        }


        function displayJuz(juzArabic, juzTranslation) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `<h2 class="text-center mb-4">Juz ${juzArabic.number}</h2>`;

            juzArabic.ayahs.forEach((ayah, index) => {
                const translation = juzTranslation.ayahs[index];
                contentDiv.innerHTML += `
                    <div class="ayah">
                        <div class="ayah-number text-primary mb-2">
                            Surah ${ayah.surah.name} Ayat ${ayah.numberInSurah}
                        </div>
                        <div class="arabic-text mb-3">${ayah.text}</div>
                        <div class="indonesian-text mb-3">${translation.text}</div>
                        <audio controls class="mb-4">
                            <source src="${ayah.audio}" type="audio/mpeg">
                            Browser tidak mendukung audio.
                        </audio>
                    </div>`;
            });
        }

        function handleSearch() {
            const searchTerm = this.value.toLowerCase();
            document.querySelectorAll('.ayah').forEach(ayah => {
                const text = ayah.textContent.toLowerCase();
                ayah.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const navbar = document.querySelector('.navbar');
            navbar.classList.toggle('bg-light');
            navbar.classList.toggle('bg-dark');
        }
    </script>
