            <div class="form-group">

                <option value="">Select Juz</option>
              </select>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Populate Juz options
        const juzSelect = document.getElementById("juz");
        for (let j = 1; j <= 30; j++) {
          const option = document.createElement("option");
          option.value = j;
          option.textContent = `Juz ${j}`;
          juzSelect.appendChild(option);
        }

        // Fetch Surah data
        fetch("https://equran.id/api/v2/surat")
          .then((response) => response.json())
          .then((data) => {
            const surahSelect = document.getElementById("surah");
            data.data.forEach((surah) => {
              const option = document.createElement("option");
              option.value = surah.nomor;
              option.textContent = `${surah.nama} (${surah.namaLatin})`;
              surahSelect.appendChild(option);
            });

            // Load last selection from local storage
            const lastSurah = localStorage.getItem("lastSurah");
            const lastJuz = localStorage.getItem("lastJuz");
            const lastAyahIndex = localStorage.getItem("lastAyahIndex");

            if (lastSurah) {
              surahSelect.value = lastSurah;
            }
            if (lastJuz) {
              juzSelect.value = lastJuz;
            }

            if (lastSurah || lastJuz) {
              handleSelectChange(lastAyahIndex);
            }
          });

        // Add event listeners for select changes with reset
        document
          .getElementById("surah")
          .addEventListener("change", function () {
            document.getElementById("juz").value = "";
            handleSelectChange();
          });

        document.getElementById("juz").addEventListener("change", function () {
          document.getElementById("surah").value = "";
          handleSelectChange();
        });
      });

      function handleSelectChange(lastAyahIndex) {
        const surahSelect = document.getElementById("surah");
        const juzSelect = document.getElementById("juz");
        const loadingText = document.querySelector(".loading p");

        let selectedSurahText = "";
        let selectedJuzText = "";

        if (surahSelect.value) {
          selectedSurahText =
            surahSelect.options[surahSelect.selectedIndex].text;
          loadingText.textContent = `Loading the Quran Data for Surah: ${selectedSurahText}`;
        } else if (juzSelect.value) {
          selectedJuzText = juzSelect.options[juzSelect.selectedIndex].text;
          loadingText.textContent = `Loading the Quran Data for Juz: ${selectedJuzText}`;
        } else {
          return;
        }

        // Save to local storage
        localStorage.setItem("lastSurah", surahSelect.value);
        localStorage.setItem("lastJuz", juzSelect.value);

        document.querySelector(".loading").style.display = "flex";
        fetchData(lastAyahIndex);
      }

      function fetchData(lastAyahIndex) {
        const surahSelect = document.getElementById("surah");
        const juzSelect = document.getElementById("juz");
        const contentDiv = document.getElementById("content");
        contentDiv.innerHTML = "";

        let apiUrl = "";

        if (surahSelect.value) {
          apiUrl = `https://equran.id/api/v2/surat/${surahSelect.value}`;
        } else if (juzSelect.value) {
          const juzNumber = juzSelect.value;
          const juzApiUrlArabic = `https://api.alquran.cloud/v1/juz/${juzNumber}/quran-simple`;
          const juzApiUrlTranslate = `https://api.alquran.cloud/v1/juz/${juzNumber}/id.indonesian`;

          Promise.all([fetch(juzApiUrlArabic), fetch(juzApiUrlTranslate)])
            .then((responses) =>
              Promise.all(responses.map((response) => response.json()))
            )
            .then(([arabicData, translateData]) => {
              const juzArabic = arabicData.data;
              const juzTranslate = translateData.data;

              contentDiv.innerHTML += `<h2>Juz ${juzArabic.number}</h2>`;

              juzArabic.ayahs.forEach((ayahArabic, index) => {
                // Find the corresponding translation based on ayah number
                const ayahTranslate = juzTranslate.ayahs.find(
                  (trans) => trans.number === ayahArabic.number
                );

                // Check if translation is found. If not skip it.
                if (!ayahTranslate) {
                  console.warn(
                    `Translation not found for ayah number ${ayahArabic.number}`
                  );
                  return;
                }

                let isBookmarked =
                  lastAyahIndex !== null &&
                  lastAyahIndex !== undefined &&
                  index == lastAyahIndex;

                contentDiv.innerHTML += `
                          <div class="ayah ${
                            isBookmarked ? "bookmarked" : ""
                          }" data-ayah-index="${index}">
                              <i class="fa fa-bookmark bookmark-icon" onclick="toggleBookmark(${index})"></i>
                              <p class="ayah-number"><strong>Ayat ${
                                ayahArabic.numberInSurah
                              }</strong></p>
                              <p class="ayah-text arabic-text">${
                                ayahArabic.text
                              }</p>
                              <p class="ayah-text indonesian-text">${
                                ayahTranslate.text
                              }</p>
                          </div>`;
              });

              // After rendering, scroll to last read position
              if (lastAyahIndex !== null && lastAyahIndex !== undefined) {
                setTimeout(() => {
                  const ayahElements = contentDiv.querySelectorAll(".ayah");
                  if (ayahElements[lastAyahIndex]) {
                    ayahElements[lastAyahIndex].scrollIntoView({
                      behavior: "smooth",
                      block: "start",
                    });
                    const marker = document.createElement("div");
                    marker.classList.add("last-read-marker");
                    ayahElements[lastAyahIndex].appendChild(marker);
                  }
                }, 100);
              }
            })
            .catch((err) => console.error(err))
            .finally(() => {
              document.querySelector(".loading").style.display = "none";
            });
          return;
        }

        fetch(apiUrl)
          .then((response) => response.json())
          .then((data) => {
            const surah = data.data;
            contentDiv.innerHTML += `<h2>${surah.nama} (${surah.namaLatin})</h2><p>${surah.deskripsi}</p>`;
            surah.ayat.forEach((ayah, index) => {
              let isBookmarked =
                lastAyahIndex !== null &&
                lastAyahIndex !== undefined &&
                index == lastAyahIndex;

              contentDiv.innerHTML += `
                            <div class="ayah ${
                              isBookmarked ? "bookmarked" : ""
                            }" data-ayah-index="${index}">
                                <i class="fa fa-bookmark bookmark-icon" onclick="toggleBookmark(${index})"></i>
                                <p class="ayah-number"><strong>Ayat ${
                                  ayah.nomorAyat
                                }:</strong></p>
                                <p class="ayah-text arabic-text">${
                                  ayah.teksArab
                                }</p>
                                <p class="ayah-text indonesian-text">${
                                  ayah.teksIndonesia
                                }</p>
                            </div>`;
            });

            // After rendering, scroll to last read position
            if (lastAyahIndex !== null && lastAyahIndex !== undefined) {
              setTimeout(() => {
                const ayahElements = contentDiv.querySelectorAll(".ayah");
                if (ayahElements[lastAyahIndex]) {
                  ayahElements[lastAyahIndex].scrollIntoView({
                    behavior: "smooth",
                    block: "start",
                  });
                  const marker = document.createElement("div");
                  marker.classList.add("last-read-marker");
                  ayahElements[lastAyahIndex].appendChild(marker);
                }
              }, 100);
            }
          })
          .catch((err) => console.error(err))
          .finally(() => {
            document.querySelector(".loading").style.display = "none";
          });
      }

      function toggleBookmark(ayahIndex) {
        localStorage.setItem("lastAyahIndex", ayahIndex);

        //Get current ayah element
        const contentDiv = document.getElementById("content");
        const ayahElements = contentDiv.querySelectorAll(".ayah");

        ayahElements.forEach((ayah, index) => {
          ayah.classList.remove("bookmarked");
        });

        const selectedAyah = ayahElements[ayahIndex];

        // Toggle "bookmarked" class
        selectedAyah.classList.add("bookmarked");

        // Remove and re-add marker
        const marker = selectedAyah.querySelector(".last-read-marker");
        if (marker) {
          selectedAyah.removeChild(marker);
        }

        const newMarker = document.createElement("div");
        newMarker.classList.add("last-read-marker");
        selectedAyah.appendChild(newMarker);

        //alert('Ayah bookmarked!');
      }
    </script>
