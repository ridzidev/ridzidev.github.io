<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Image Viewer with Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        input {
            padding: 10px;
            width: 300px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        .image-wrapper {
            position: relative;
            display: inline-block;
            margin-top: 20px;
            max-width: 100%;
        }
        .image-wrapper img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #007BFF;
            font-weight: bold;
        }
        .gallery {
            margin-top: 30px;
        }
        .gallery img {
            margin: 5px;
            max-width: 150px;
            max-height: 150px;
            cursor: pointer;
            border: 1px solid #ccc;
        }
        .gallery img:hover {
            border-color: #007BFF;
        }
    </style>
</head>
<body>
    <h1>Secure Image Viewer with Gallery</h1>
    <input type="text" id="imageUrl" placeholder="Enter HTTP image URL here" />
    <button onclick="loadImage()">View Image</button>
    <div id="imageContainer"></div>
    <h2>Gallery</h2>
    <div class="gallery" id="galleryContainer"></div>

    <script>
        const galleryKey = "imageGallery";

        // Load gallery from localStorage
        function loadGallery() {
            const galleryContainer = document.getElementById('galleryContainer');
            galleryContainer.innerHTML = ''; // Clear gallery
            const storedGallery = JSON.parse(localStorage.getItem(galleryKey)) || [];
            storedGallery.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.alt = "Gallery Image";
                img.onclick = () => loadImageFromGallery(url);
                galleryContainer.appendChild(img);
            });
        }

        // Add image to gallery in localStorage
        function addToGallery(url) {
            const storedGallery = JSON.parse(localStorage.getItem(galleryKey)) || [];
            if (!storedGallery.includes(url)) {
                storedGallery.push(url);
                localStorage.setItem(galleryKey, JSON.stringify(storedGallery));
            }
        }

        // Load image from the gallery
        function loadImageFromGallery(url) {
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.innerHTML = ''; // Clear previous image

            // Create image wrapper
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            // Create image element
            const img = document.createElement('img');
            img.src = url;
            img.alt = "Image via Gallery";

            // Add image to wrapper and display
            wrapper.appendChild(img);
            imageContainer.appendChild(wrapper);
        }

        // Load image from user input
        function loadImage() {
            const imageUrl = document.getElementById('imageUrl').value;
            const imageContainer = document.getElementById('imageContainer');

            // Clear previous content
            imageContainer.innerHTML = '';

            if (imageUrl) {
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(imageUrl)}`;

                // Create image wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';

                // Create image element
                const img = document.createElement('img');
                img.src = proxyUrl;
                img.alt = "Image via Proxy";

                // Create loading overlay
                const loadingOverlay = document.createElement('div');
                loadingOverlay.className = 'loading-overlay';
                loadingOverlay.textContent = 'Loading...';

                // Add loading overlay to wrapper
                wrapper.appendChild(img);
                wrapper.appendChild(loadingOverlay);

                // Add wrapper to container
                imageContainer.appendChild(wrapper);

                // Handle image load success
                img.onload = function() {
                    loadingOverlay.style.display = 'none'; // Hide loading overlay
                    addToGallery(proxyUrl); // Save to gallery
                    loadGallery(); // Refresh gallery
                };

                // Handle image load error
                img.onerror = function() {
                    loadingOverlay.textContent = 'Failed to load image.';
                    loadingOverlay.style.color = 'red'; // Change overlay color to red
                };
            } else {
                imageContainer.innerHTML = '<p style="color:red;">Please enter a valid image URL.</p>';
            }
        }

        // Initialize gallery on page load
        loadGallery();
    </script>
</body>
</html>
